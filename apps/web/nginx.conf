# Serves the built SPA and proxies /api to the API container, so the browser sees one origin
# (first-party SameSite=Lax cookies, no CORS). Installed as /etc/nginx/conf.d/default.conf, which
# the base image includes inside its `http` block.

# Hashed build assets never change; index.html must be revalidated so new deploys show up.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Matches the API's default BODY_LIMIT_BYTES (1 MiB). Change both together.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API (TRUST_PROXY=true) trusts only the rightmost entry, which nginx appends here.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        # script-src: the hash allows only the inline anti-flash theme script in index.html. After
        # editing that script, print the new hash from the repository root and replace it below:
        #   node -e 'const s=require("fs").readFileSync("apps/web/index.html","utf8").match(/<script>([\s\S]*?)<\/script>/)[1];console.log("sha256-"+require("crypto").createHash("sha256").update(s).digest("base64"))'
        # style-src needs 'unsafe-inline': Radix (scroll lock) and Sonner inject <style> tags at runtime.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-mEEY71e6vTj6zpuc998WYffGFOtsVYO7xz4BLc6pD6c='; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # Client-side routes fall back to the SPA entry point.
        try_files $uri /index.html;

        # A missing hashed asset is a 404, not index.html served as JavaScript.
        location /assets/ {
            try_files $uri =404;
        }
    }
}
